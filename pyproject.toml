[project]
name = "etl-python-ibge"
version = "0.10.3"
description = "ETL da API do IBGE"
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "types-requests (>=2.33.0.20260712,<3.0.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pymysql (>=1.2.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "etl_python_ibge", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
etl = "etl_python_ibge.main:main"

[dependency-groups]
dev = [
    "mypy (>=2.3.0,<3.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "types-pyyaml (>=6.0.12.20260724,<7.0.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]

[tool.taskipy.tasks]
app = "etl"
pytest = "poetry run pytest ."
covhtml = "poetry run pytest --cov=etl_python_ibge --cov-report=html"
covcmd = "poetry run pytest --cov=etl_python_ibge --cov-report=term-missing"
format = "poetry run ruff format ."
lint = "ruff check ."
mypy = "poetry run mypy ."
check = "poetry run ruff format --check ."
precommit = "poetry run pre-commit run --all-files"
fix = "poetry run ruff check . --fix"
